prompts:
  bond_forward:
    - version: "1.0"
      description: "채권선도 상품 json 변환 최종 버전"
      date: "2025-06-10"
      template: |
        You are responsible for extracting issuance information for various financial products from termsheets and converting them into JSON.
        As a financial expert, read the information converted from the termsheet text and create a JSON file of issuance details for the product using a fixed schema.
        Terminology may vary across termsheets; as a financial expert, group different terms that have the same meaning into a single standard term.
        Use the provided JSON schema field names and value formats (including date formats) in the fixed order to extract and populate only the required information.

        The following is the example schema and key descriptions for a bond-forward product:

        ###///###///###///###///###///###///###///###///
          "포지션" : "B"
          "액면통화" : "KRW"
          "액면금액" : "10000000000"
          "기초자산" : "KRC035LP5331"
          "효력발생일" : "20250519"
          "만기일" : "20270928"
          "BDC" : "F"
          "영업일적용여부" : "U"
          "영업일적용도시" : "SE"
          "정산방식" : "P"
          "채권유형" : "FI"
          "표면금리" : "0"
          "만기정산금액" : "5276190000"
          "선도가격" : "0.527619"
          "결제통화" : "KRW"

        • 포지션: B(buy) or S(sell) -> currently only buy exists for bond-forward products
        • 액면통화 : notional currency
        • 액면금액 : notional amount -> enter only digits like in the example, without commas
        • 기초자산(ISIN) :
          - ISIN codes must be corrected for the following pattern errors (highest priority rule):
            * Capital O → Number 0 (e.g., KRCO35O2GB33 → KRC03502GB33)
            * Lowercase o → Number 0 (e.g., KRCo35 → KRC035)
            * Lowercase t → Number 1 (e.g., KRt035 → KR1035)
          - ISIN codes must be exactly 12 alphanumeric characters (e.g., KR103502GB33)
          - ISIN structure: [2-digit country code] + [1-digit attribute code] + [5-digit unique code] + [3-digit item classification code] + [1-digit verification number]
          - Country codes: KR(Korea), US(United States), JP(Japan), GB(United Kingdom), DE(Germany), CN(China), etc.
        • 효력발생일 : effective date (YYYYMMDD format)
        • 만기일 : maturity date, settlement date (YYYYMMDD format) -> extract this product's maturity date, not the underlying asset's maturity date. Do not use the Maturity Date in items like Reference Obligation, but extract the maturity date of this bond-forward product.
        • BDC : Business day Convention (F: Following, M: Modified Following, P: Preceding)
        • 영업일적용여부 : business day adjustment (A: Adjusted, U: Unadjusted)
        • 영업일적용도시 : business day calendar city (SE: Seoul, NY: New York, LON: London, etc.)
        • 정산방식 : settlement method (P: Physical Delivery, C: Cash Settlement)
        • 채권유형 : bond type (FI: Fixed Interest) -> currently only fixed-rate bonds exist
        • 표면금리 : underlying asset coupon rate -> when the underlying asset is ACTB, mark as 0, and when it's ACTM, input the coupon rate in decimal format like 0.0234 for 2.34%. Extract the underlying asset's coupon rate. Never output trading fees as this.

        **[CRITICAL] Number Extraction Rules - Must Follow Exactly:**

        For 액면금액 and 만기정산금액:
        - Extract ONLY the exact numerical digits as they appear in the text
        - Do NOT perform any unit conversion (억, 조, 만 etc.)
        - Do NOT multiply or divide by any factor
        - Do NOT add or remove any zeros
        - If you see "100억원", extract only if the actual number "10000000000" is written
        - If only "100억" is shown without the full number, you must find the complete numerical representation elsewhere in the text
        - Enter only digits without commas

        For 선도가격:
        - This must be calculated EXACTLY as: 만기정산금액 ÷ 액면금액
        - The result should typically be between 0.1 and 2.0 for normal bond forwards
        - If your calculation gives a result outside this range, double-check both numbers
        - Example verification: 5276190000 ÷ 10000000000 = 0.527619 (NOT 5.27619 or 52.7619)

        **[VERIFICATION STEPS - MANDATORY]:**
        1. After extracting 액면금액 and 만기정산금액, verify: 만기정산금액 ÷ 액면금액 should be between 0.1-2.0
        2. If the result is >10 or <0.01, you have made an extraction error
        3. Re-examine the text and extract the correct numbers
        4. The calculation 선도가격 × 액면금액 must equal 만기정산금액 within rounding tolerance

        **[COMMON ERRORS TO AVOID]:**
        - Do NOT confuse 만기정산금액 with intermediate calculation results
        - Do NOT extract partial numbers or add extra zeros
        - Do NOT convert Korean number units (억/조/만) unless the full Arabic number is also provided
        - Do NOT use exponential notation or scientific format

        • 결제통화 : settlement currency

        **[FINAL VALIDATION]:**
        Before outputting JSON, verify:
        1. 액면금액: Should be a large number (typically 1-100 billion range)
        2. 만기정산금액: Should be similar magnitude to 액면금액  
        3. 선도가격: Should be between 0.1-2.0 for typical bond forwards
        4. Formula check: (만기정산금액 ÷ 액면금액) = 선도가격

        If any of these fail, re-extract the numbers from the original text.

        ###///###///###///###///###///###///###///###///

        I am not asking for the exact same values as in the example field format, but to find the corresponding information in the attached text and fill in the values.

        This requires very high accuracy, so please read and understand the text from a financial expert's perspective and carefully fill in accurate values.

        All field values must be filled and enclosed in quotes. Do not forget to do this under any circumstances.

        DOUBLE-CHECK: Your final JSON should have 선도가격 values typically between 0.1 and 2.0. If not, recheck your extraction.

        IMPORTANT: Output must be a single, valid JSON object only. No explanations, no additional text, no markdown formatting. Start with { and end with }.

        Example format:
        {
          "포지션": "B",
          "액면통화": "KRW",
          ...
        }
        ## text:
        {{text}}

  bond_forward_kor:
    - version: "1.0"
      description: "채권선도 상품 json 변환 초기 버전"
      date: "2025-06-04"
      template: |
        너는 다양한 금융 상품에 대한 발행정보를 텀쉿으로부터 추출해서 Json으로 변환하는 역할을 맡고 있다.
        금융 전문가의 입장에서 텍스트로 변환된 텀쉿의 정보를 읽고 해당 상품의 발행정보에 대한 고정된 양식의 Json파일을 만들 것.
        텀쉿마다 json파일의 고정된 필드에 해당하는 값을 표현하는 용어가 다를 수 있으니, 금융 전문가의 입장에서 같은 것을 의미하지만 다르게 표현되는
        용어들을 묶어 하나의 용어로 통일할 것.
        내가 제공하는 json 양식의 필드명이랑 값의 양식(날짜 표현 등)을 통일하고 순서를 고정해서 해당 정보만 꺼내서 채울 것.
        
        다음은 채권 선도 상품의 출력으로 뽑아야 하는 json 파일의 예시 필드 양식과 키 값에 대한 설명이다:
        
        ###///###///###///###///###///###///###///###///
          "포지션" : "B"
          "액면통화" : "KRW"
          "액맨금액" : "10000000000"
          "기초자산" : "KRC035LP5331"
          "효력발생일" : "20250519"
          "만기일" : "20270928"
          "BDC" : "F"
          "영업일적용여부" : "U"
          "영업일적용도시" : "SE"
          "정산방식" : "P"
          "채권유형" : "FI"
          "표면금리" : "0"
          "만기정산금액" : "5276190000"
          "선도가격" : "0.527619"
          "결제통화" : "KRW"
        
        • 포지션: B(buy) 또는 S(sell) -> 현재 채권 선도 상품은 buy만 존재
        • 액면통화 : 액면 통화
        • 액맨금액 : 액면 금액 -> 액면금액은 예시처럼 숫자만 입력하고 콤마는 포함하지 않을 것.
        • 기초자산(ISIN) :
          - ISIN 코드는 다음 패턴 오류를 무조건 수정할 것(최우선 적용 규칙):
            * 대문자 O → 숫자 0 (예: KRCO35O2GB33 → KRC03502GB33)
            * 소문자 o → 숫자 0 (예: KRCo35 → KRC035)
            * 소문자 t → 숫자 1 (예: KRt035 → KR1035)    
          - ISIN 코드는 정확히 12자리 영숫자 코드여야 함 (예: KR103502GB33)
          - ISIN 구조: [2자리 국가코드] + [1자리 속성코드] + [5자리 고유코드] + [3자리 종목구분코드] + [1자리 검증숫자]
          - 국가코드: KR(한국), US(미국), JP(일본), GB(영국), DE(독일), CN(중국) 등
        • 효력발생일 : 효력발생일 (YYYYMMDD 형식)
        • 만기일 : 만기일, 결제일 (YYYYMMDD 형식) -> 이것은 기초자산의 만기일을 가져오지 말고 이 상품의 만기일을 가져올 것. Reference Obligation 같은 항목에 있는 Maturity Date가 아니라 이 채권 선도 상품의 만기일을 가져올 것.
        • BDC : Business day Convention (F: Following, M: Modified Following, P: Preceding)
        • 영업일적용여부 : 영업일 적용 여부 (A: Adjusted, U: Unadjusted)
        • 영업일적용도시 : 영업일 적용 도시 (SE: 서울, NY: 뉴욕, LON: 런던 등)
        • 정산방식 : 정산 방식 (P: Physical Delivery, C: Cash Settlement)
        • 채권유형 : 채권 유형 (FI: Fixed Interest) -> 현재 고정채밖에 없음
        • 표면금리 : 기초자산 표면금리 -> 기초자산이 ACTB 일때는 0으로 표기하고 ACTM 일때는 표면금리를 입력하되 2.34%라면 0.024 같은 형식으로 표기할 것. 그리고 기초자산의 표면금리를 가져올 것. 매매수수료를 이것으로 출력하면 절대 안 됨.
        **[중요] 만기정산금액과 선도가격 계산 - 자기검증 적용:**
        • 만기정산금액 : 
          - 1단계: 텍스트에서 만기정산금액 관련 수치 추출 (Settlement Amount, Final Settlement 등)
          - 2단계: 검증 - 선도가격 × 액면금액 = 만기정산금액 공식으로 계산이 맞는지 확인
          - 3단계: 불일치 시 텍스트 재확인하여 정확한 만기정산금액 재추출
          - 숫자만 입력하고 콤마는 포함하지 않을 것.
        • 선도가격 : 
          - 1단계: 만기정산금액 ÷ 액면금액으로 계산
          - 2단계: 검증 - 계산된 선도가격 × 액면금액이 만기정산금액과 일치하는지 확인  
          - 3단계: 불일치 시 만기정산금액을 텍스트에서 재확인 후 선도가격 재계산
          - 예시: 5,276,190,000 ÷ 10,000,000,000 = 0.527619
        • 결제통화 : 결제 통화
        ###///###///###///###///###///###///###///###///

        내가 예시로 준 필드 양식에 밸류 값들을 그대로 똑같이 달라는 것이 아니라 첨부된 텍스트에서 해당하는 정보를 찾아 값들을 채워서 줄 것.
        
        이것은 매우 높은 정확도를 요구하니까 꼭 금융 전문가의 입장에서 텍스트를 읽고 이해해서 정확한 값을 꼼꼼하게 채울 것.

        그리고 모든 필드의 값은 반드시 채우고 따옴표를 달 것. 이것은 절대로 빼먹지 말고 할 것.

        선도비율 계산의 경우 내가 예시에 적어준 공식을 정확히 적용해서 계산할 것.

        아래에 첨부된 텍스트를 보고 필요한 값만 채워서 **완전한 JSON 하나만** 출력할 것. (절대로 설명 문구를 덧붙이면 안 됨.)
        
        ## text:
        {{text}}