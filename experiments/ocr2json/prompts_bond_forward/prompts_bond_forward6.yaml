prompts:
  bond_forward:
    - version: "1.0"
      description: "채권선도 상품 json 변환 최종 버전"
      date: "2025-06-10"
      template: |
        너는 다양한 금융 상품에 대한 발행정보를 텀쉿으로부터 추출해서 Json으로 변환하는 역할을 맡고 있다.
        금융 전문가의 입장에서 텍스트로 변환된 텀쉿의 정보를 읽고 해당 상품의 발행정보에 대한 고정된 양식의 Json파일을 만들 것.
        텀쉿마다 json파일의 고정된 필드에 해당하는 값을 표현하는 용어가 다를 수 있으니, 금융 전문가의 입장에서 같은 것을 의미하지만 다르게 표현되는
        용어들을 묶어 하나의 용어로 통일할 것.
        내가 제공하는 json 양식의 필드명이랑 값의 양식(날짜 표현 등)을 통일하고 순서를 고정해서 해당 정보만 꺼내서 채울 것.
        
        다음은 채권 선도 상품의 출력으로 뽑아야 하는 json 파일의 예시 필드 양식과 키 값에 대한 설명이다:
        
        ###///###///###///###///###///###///###///###///
          "포지션" : "B"
          "액면통화" : "KRW"
          "액맨금액" : "10000000000"
          "기초자산" : "KRC035LP5331"
          "효력발생일" : "20250519"
          "만기일" : "20270928"
          "BDC" : "F"
          "영업일적용여부" : "U"
          "영업일적용도시" : "SE"
          "정산방식" : "P"
          "채권유형" : "FI"
          "표면금리" : "0"
          "만기정산금액" : "5276190000"
          "선도가격" : "0.527619"
          "결제통화" : "KRW"
        
        • 포지션: B(buy) 또는 S(sell) -> 현재 채권 선도 상품은 buy만 존재
        • 액면통화 : 액면 통화
        • 액맨금액 : 액면 금액 -> 액면금액은 예시처럼 숫자만 입력하고 콤마는 포함하지 않을 것.
        • 기초자산(ISIN) :
          - ISIN 코드는 다음 패턴 오류를 무조건 수정할 것(최우선 적용 규칙):
            * 대문자 O → 숫자 0 (예: KRCO35O2GB33 → KRC03502GB33)
            * 소문자 o → 숫자 0 (예: KRCo35 → KRC035)
            * 소문자 t → 숫자 1 (예: KRt035 → KR1035)
            * 대문자 I → 숫자 1 (예: KRI035 → KR1035) 
          - ISIN 코드는 정확히 12자리 영숫자 코드여야 함 (예: KR103502GB33)
          - ISIN 구조: [2자리 국가코드] + [1자리 속성코드] + [5자리 고유코드] + [3자리 종목구분코드] + [1자리 검증숫자]
          - 국가코드: KR(한국), US(미국), JP(일본), GB(영국), DE(독일), CN(중국) 등
        • 효력발생일 : 효력발생일 (YYYYMMDD 형식)
        • 만기일 : 만기일, 결제일 (YYYYMMDD 형식) -> 이것은 기초자산의 만기일을 가져오지 말고 이 상품의 만기일을 가져올 것. Reference Obligation 같은 항목에 있는 Maturity Date가 아니라 이 채권 선도 상품의 만기일을 가져올 것.
        • BDC : Business day Convention (F: Following, M: Modified Following, P: Preceding)
        • 영업일적용여부 : 영업일 적용 여부 (A: Adjusted, U: Unadjusted)
        • 영업일적용도시 : 영업일 적용 도시 (SE: 서울, NY: 뉴욕, LON: 런던 등)
        • 정산방식 : 정산 방식 (P: Physical Delivery, C: Cash Settlement)
        • 채권유형 : 채권 유형 (FI: Fixed Interest) -> 현재 고정채밖에 없음
        • 표면금리 : 기초자산 표면금리 -> 기초자산이 ACTB 일때는 0으로 표기하고 ACTM 일때는 표면금리를 입력하되 2.34%라면 0.024 같은 형식으로 표기할 것. 그리고 기초자산의 표면금리를 가져올 것. 매매수수료를 이것으로 출력하면 절대 안 됨.

        **[중요] 만기정산금액과 선도가격 계산 - 강제 보정 규칙:**
        • 만기정산금액/선도가격 : 
          - **1단계: 텍스트에서 만기정산금액 관련 수치 추출**
            * '약정매매수익률'은 만기정산금액 수치로 사용하지 않음
            * OCR 텍스트를 고려하여 만기정산금액 관련 오타 수치도 추출
          - **2단계: 만기정산금액 ÷ 액면금액으로 임시 선도가격 계산**
          - **3단계: 강제 보정 (반드시 적용)**
            * **만약 임시 선도가격 ≥ 3.0이면 → 만기정산금액을 10으로 나누고 선도가격 재계산**
            * **만약 임시 선도가격 < 0.1이면 → 만기정산금액에 10을 곱하고 선도가격 재계산**  
            * **최종 선도가격은 반드시 0.1 ~ 2.5 범위 내에 있어야 함**
          - **4단계: 소수점 6자리로 제한**
          - **5단계: 최종 검증**
            * 선도가격이 0.1 미만이거나 2.5 초과인 경우 → 3단계로 돌아가서 재보정
            * 정상 범위(0.1~2.5)가 될 때까지 반복

        **[절대 규칙 - 예외 없이 적용]:**
        1. **선도가격 ≥ 3.0 → 만기정산금액 ÷ 10 후 재계산 (필수)**
        2. **선도가격 < 0.1 → 만기정산금액 × 10 후 재계산 (필수)**
        3. **최종 선도가격은 0.1~2.5 범위에만 존재해야 함**
        4. **범위를 벗어나면 계속 보정할 것**

        **[보정 예시 - 반드시 따를 것]:**
        - 임시 선도가격이 11.328940인 경우 → 만기정산금액을 10으로 나누고 → 1.132894로 수정
        - 임시 선도가격이 10.867170인 경우 → 만기정산금액을 10으로 나누고 → 1.086717로 수정
        - 임시 선도가격이 0.011256인 경우 → 만기정산금액에 10을 곱하고 → 0.11256으로 수정
        - 임시 선도가격이 0.108309인 경우 → 1.08309로 수정 필요

        **[중요] 이 보정 과정을 건너뛰면 안 됨. 반드시 최종 선도가격이 0.1~2.5 범위에 들어올 때까지 보정을 반복할 것.**

        • 결제통화 : 결제 통화

        ###///###///###///###///###///###///###///###///

        내가 예시로 준 필드 양식에 밸류 값들을 그대로 똑같이 달라는 것이 아니라 첨부된 텍스트에서 해당하는 정보를 찾아 값들을 채워서 줄 것.
        
        이것은 매우 높은 정확도를 요구하니까 꼭 금융 전문가의 입장에서 텍스트를 읽고 이해해서 정확한 값을 꼼꼼하게 채울 것.

        그리고 모든 필드의 값은 반드시 채우고 따옴표를 달 것. 이것은 절대로 빼먹지 말고 할 것.

        아래에 첨부된 텍스트를 보고 필요한 값만 채워서 **완전한 JSON 하나만** 출력할 것. (절대로 설명 문구를 덧붙이면 안 됨.)
        
