system_prompt: "You are a helpful assistant specialized in analyzing financial documents and OCR text."

user_prompt_template: |
  다음은 금융 문서에서 OCR로 추출한 텍스트입니다. 금융 문서의 특성을 고려하여 다음 작업을 수행해주세요:

  **기본 후처리 작업:**
  1. 오타 및 인식 오류 수정
  2. 문장 구조 개선
  3. 불필요한 공백이나 줄바꿈 정리
  4. 한국어/영어 맞춤법 검사
  5. 표나 목록 형태가 있다면 마크다운 형식으로 정리

  **금융 문서 작업:**
  6. 금융 용어 정확성 확인 및 수정:
    - 금융 전문용어의 띄어쓰기 및 표기법 통일
    - 계약 관련 용어의 정확한 표기 (예: 명목금액, 매매수익률, 만기일 등)
    - 파생상품, 채권, 주식 등 금융상품 용어의 표준 표기법 적용
    - 법률 및 규제 관련 용어의 정확한 표기

  7. 숫자 및 단위 정확성 검토:
    - 수익률, 이자율 등은 적절한 % 표시 추가
    - 금액은 통화 단위 명확히 표시 (KRW, USD, EUR 등)
    - 계좌번호, 코드번호, UTI 등 식별번호의 정확성 확인
    - 날짜 형식 통일

  8. ISIN 코드 및 금융상품 식별번호 검증:
    - ISIN 코드는 다음 패턴 오류를 무조건 수정해야 함(최우선 적용 규칙):
        * 대문자 O → 숫자 0 (예: KRCO35 → KRC035)
        * 소문자 o → 숫자 0 (예: KRCo35 → KRC035)
        * 소문자 t → 숫자 1 (예: KRt035 → KR1035)
    
    - ISIN 코드는 정확히 12자리 영숫자 코드여야 함 (예: KR103502GB33)
    - ISIN 구조: [2자리 국가코드] + [1자리 속성코드] + [5자리 고유코드] + [3자리 종목구분코드] + [1자리 검증숫자]
    - 국가코드: KR(한국), US(미국), JP(일본), GB(영국), DE(독일), CN(중국) 등

  9. 금융 문서 필수 요소 확인:
      - 계약 조건 (체결일, 만기일, 결제일) 명확한 표기
      - 금융상품 코드, ISIN 등 식별번호 정확성

  원본 OCR 텍스트:
  {ocr_text}

  후처리된 텍스트만 출력해주세요.

additional_instructions: |
  - 금액, 날짜, 계좌번호, 코드번호 등 중요한 숫자는 명백한 OCR 오류만 수정하고 임의 변경 금지
  - 법률 용어나 금융 전문용어는 정확성을 최우선으로 하되, 불확실한 경우 원본 유지