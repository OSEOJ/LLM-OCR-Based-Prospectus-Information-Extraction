system_prompt: "You are a helpful assistant specialized in analyzing financial documents and OCR text."

user_prompt_template: |
  다음은 금융 문서에서 OCR로 추출한 텍스트입니다. 금융 문서의 특성을 고려하여 다음 작업을 수행해주세요:

  **기본 후처리 작업:**
  1. 오타 및 인식 오류 수정
  2. 문장 구조 개선
  3. 불필요한 공백이나 줄바꿈 정리
  4. 한국어/영어 맞춤법 검사
  5. 표나 목록 형태가 있다면 마크다운 형식으로 정리

  **금융 문서 작업:**
  6. 금융 용어 정확성 확인 및 수정:
    - 금융 전문용어의 띄어쓰기 및 표기법 통일
    - 계약 관련 용어의 정확한 표기 (예: 명목금액, 매매수익률, 만기일 등)
    - 파생상품, 채권, 주식 등 금융상품 용어의 표준 표기법 적용
    - 법률 및 규제 관련 용어의 정확한 표기

  7. 숫자 및 단위 정확성 검토:
    - 수익률, 이자율 등은 적절한 % 표시 추가
    - 금액은 통화 단위 명확히 표시 (KRW, USD, EUR 등)
    - 계좌번호, 코드번호, UTI 등 식별번호의 정확성 확인
    - 날짜 형식 통일

  8. ISIN 코드 및 금융상품 식별번호 검증:
    - ISIN 코드는 정확히 12자리 영숫자 코드여야 함 (예: KR103502GB33)
    - ISIN 구조: [2자리 국가코드] + [1자리 속성코드] + [5자리 고유코드] + [3자리 종목구분코드] + [1자리 검증숫자]
    
    - 국가코드: KR(한국), US(미국), JP(일본), GB(영국), DE(독일), CN(중국) 등
    - 속성코드: 1(국채), 2(지방채), 3(특수채), 4(선물옵션), 5(수익증권), 6(사채), 7(주권), 8(유가증권예탁증서),
              A(신주인수권증서/증권), B(외국채권), C(스트립), D(지표), E(양도성예금증서 CD), F(어음), 9,X,Y,Z(사용자영역)

    - ISIN 검사코드 계산 및 검증:
      * Double-Add-Double 방식으로 검사코드 계산
      * 영문자는 숫자로 변환 (A=10, B=11, C=12, ..., Z=35)
      * 맨 오른쪽에 위한 숫자부터 2배, 1배, 2배, 1배 순으로 곱함
      * 각 자리수의 합을 구하고, 10으로 나눈 나머지를 10에서 뺀 값이 검사코드
      * 예시: KR703572000
        - 변환: K=20, R=27, 7=7, 0=0, 3=3, 5=5, 7=7, 2=2, 0=0, 0=0, 0=0
        - 자리수별 곱셈: 2*2, 0*1, 2*2, 7*1, 7*2, 0*1, 3*2, 5*1, 7*2, 2*1, 0*2, 0*1, 0*2
        - 계산: 4, 0, 4, 7, 1, 4, 0, 6, 5, 1, 4, 2, 0, 0, 0
        - 합계 = 4 + 0 + 4 + 7 + 1 + 4 + 0 + 6 + 5 + 1 + 4 + 2 = 38
        - 검사코드: (10 - (38 % 10)) % 10 = (10 - 8) % 10 = 2
        - 최종 ISIN: KR7035720002

    - OCR로 인한 ISIN 오인식 패턴 수정:
      * 숫자 0과 문자 O의 혼동 수정
      * 숫자 1과 문자 I/l의 혼동 수정  
      * 숫자 5와 문자 S의 혼동 수정
      * 숫자 6과 문자 G의 혼동 수정
      * 숫자 2와 문자 Z의 혼동 수정
    
    - 불완전하거나 의심스러운 ISIN 코드는 [ISIN 확인 필요: 원본값] 형태로 표시

  9. 금융 문서 필수 요소 확인:
      - 계약 조건 (체결일, 만기일, 결제일) 명확한 표기
      - 금융상품 코드, ISIN 등 식별번호 정확성

  원본 OCR 텍스트:
  {ocr_text}

  후처리된 텍스트만 출력해주세요.

additional_instructions: |
  - 금액, 날짜, 계좌번호, 코드번호 등 중요한 숫자는 명백한 OCR 오류만 수정하고 임의 변경 금지
  - 법률 용어나 금융 전문용어는 정확성을 최우선으로 하되, 불확실한 경우 원본 유지
  - 불확실하거나 판독이 어려운 내용은 [OCR 확인 필요] 표시 추가