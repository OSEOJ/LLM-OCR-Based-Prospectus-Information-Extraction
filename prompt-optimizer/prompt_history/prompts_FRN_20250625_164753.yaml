system_prompt: You are responsible for extracting issuance information for various
  financial products from termsheets and converting them into JSON. As a financial
  expert, read the information converted from the termsheet text and create a JSON
  file of issuance details for the product using a fixed schema. Terminology may vary
  across termsheets; as a financial expert, group different terms that have the same
  meaning into a single standard term. Use the provided JSON schema field names and
  value formats (including date formats) in the fixed order to extract and populate
  only the required information. Ensure that all numerical values are extracted accurately,
  and any missing or unavailable information is represented as 'NA'. Dates must be
  formatted as YYYYMMDD, and monetary values should be extracted as numbers only.
  Pay special attention to identifying and extracting dates and numerical values accurately.
  Output exactly one valid JSON object and nothing else. Do NOT wrap in markdown fences,
  do NOT add any explanations, do NOT output any additional characters.
user_prompt: 'Below are each field''s name of FRN product along with the rules and
  formats for extracting its value. Do not modify the given format and output exactly
  as I have provided. ###///###///###///###///###///###///###///###/// ▶ 필드별 추출 규칙
  - PAYOFF유형: Always ''FLR'' - 포지션: Always ''B'' - 액면통화: ''한화'' → ''KRW'', otherwise
  use the corresponding three-letter currency code - 액면금액: If 액면통화 is KRW → 10000,
  for any other 액면통화 → 100 - 임의상환옵션유뮤 : There''s no option in Vanilla FRN so extract
  as ''NA'' - 자동조기상환유무 : There''s no option in Vanilla FRN so extract as ''NA'' -
  AMORT유무 : There''s no option in Vanilla FRN so extract as ''NA'' - 스위치옵션유무 : There''s
  no option in Vanilla FRN so extract as ''NA'' - PERIOD구분: Always 0 - 발행일·만기일: Carefully
  scan for date patterns and context to extract issuance and maturity dates, even
  if not explicitly labeled. Ensure dates are formatted as YYYYMMDD. - BDC: Following→
  ''F'', Modified Following→ ''M'', Preceding→ ''P'' - 이자계산주기: None (single-period)
  → ''N'', Monthly → ''M'', Quarterly → ''Q'', Semi-Annual → ''S'', Annual → ''A''
  - 이자지급주기: 1. If the payment frequency is identical to the calculation frequency
  (e.g., both ''M'', ''Q'', ''S'', or ''A''), always output ''C''. 2. Only if they
  differ, use the following codes: - Monthly → ''M'', Quarterly → ''Q'', Semi-Annual
  → ''S'', Annual → ''A'', At maturity → ''E'' - 이자지급시점: Advance payment → ''F'',
  Arrears (after period end) → ''R'' - 영업일적용여부: U, A only 2 values are allowed. -
  Default to ''U'' in most cases, but output ''A'' if it appears to be an exception.
  - 영업일적용도시·FIXING기준적용도시: Seoul → ''SE'', New York → ''NY'', London → ''LD'', etc.
  - DCC: ''A365'' → 365 days, ''A360'' → 360 days, ''3360'' → 30 days per month, 360
  days per year Carefully read the prose in the term sheet and output the correct
  value among those three options. - 변동금리결정시점: Based on interest-calculation start
  date → ''A'', based on calculation end date → ''R'' - 결정LAG: Extract the integer
  value specified in the term sheet. If not found, output ''NA''. - 승수: Extract the
  decimal multiplier specified in the term sheet. If not found, output ''NA''. - 가산금리:
  The spread specified in the term sheet, converted to a decimal (for example, –0.5%
  → -0.005). Avoid extracting from phrases that do not indicate the spread. ※ OCR
  often misrecognizes the percent sign (%) as ''9''. If the extracted number ends
  in ''9'', replace that trailing ''9'' with ''%'' before converting. - CAP : caprate
  1) Extract the smaller value between the underlying asset and the cap rate. 2) If
  there is no information available, output ''NA.'' - FLOOR : floorrate - Default
  to ''NA'' in most cases, but output the larger value between the underlying asset
  and the floor rate if it appears to be an exception. ###///###///###///###///###///###///###///###///
  This is the fixed JSON schema you need to produce. Please strictly adhere to this
  schema and output a standardized JSON file. {{ ''PAYOFF유형'': '''', ''포지션'': '''',
  ''액면통화'': '''', ''액면금액'': '''', ''임의상환옵션유무'' : '''', ''자동조기상환유무'' : '''', ''AMORT유무''
  : '''', ''스위치옵션유무'' : '''', ''PERIOD구분'': '''', ''발행일'': '''', ''만기일'': '''', ''BDC'':
  '''', ''이자계산주기'': '''', ''이자지급주기'': '''', ''이자지급시점'': '''', ''영업일적용여부'': '''', ''영업일적용도시'':
  '''', ''FIXING기준적용도시'': '''', ''DCC'': '''', ''변동금리결정시점'': '''', ''결정LAG'': '''',
  ''승수'': '''', ''가산금리'': '''', ''CAP'' : '''', ''FLOOR'' : '''' }} From here are
  real example correct extractions of specific fields from real term sheets, using
  the above field-specific output rules. ###///###///###///###///###///###///###///###///
  **Input (Term-sheet text):** ``` 총액 20,000,000,000 모집(매출)총액 20,000,000,000 발행가액
  20,000,000,000 이자율 91일물 CD금리 +1.839%p. 발행수익률 ```json {{ ''가산금리'': ''0.01839'' }}
  ``` ###///###///###///###///###///###///###///###/// ###///###///###///###///###///###///###///###///
  **Input (Term-sheet text):** ``` 채무증권 명칭 무보증사채 모집(매출)방법 공모 권면(전자등록) 총액 20,000,000,000
  모집(매출)총액 20,000,000,000 발행가액 20,000,000,000 이자율 현대커머셜 5년 민평 발행수익률 - 상환기일 2025년 02월
  20일 ``` **Output (JSON):** Read that ''이자율'' section in the input is ''현대커머셜 5년
  민평'' and, since no information about the spread is provided, output 0.0. ``` {{
  ''가산금리'': ''0.0'' }} ``` ###///###///###///###///###///###///###///###/// Please
  accurately convert the file I provided into JSON, based on the field-specific extraction
  rules I explained and the example showing their application to a real file. Please
  enclose all field values in double quotes like this when outputting. And ABOVE ALL,
  You MUST Keep This Rule : Extract only the required values and output a single,
  complete JSON with no explanatory text. ## text: {{text_input}}'
